<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الشرح</title>
<link rel="icon" type="image/png" href="assets/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/material.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="javascript:history.back()">← رجوع</a>
  <div class="brand"><img src="assets/logo.jpg" alt="شعار المدرسة"><span>مدرسة السادات الثانوية بنين</span></div>
  <button id="discussBtn" class="discuss-btn hidden" type="button">💬 <span>مناقشة الدرس</span></button>
</header>

<main class="lesson-page">
  <div id="loading" class="state"><div class="spinner"></div>جاري تحميل الشرح...</div>
  <div id="error" class="state error hidden"></div>

  <article id="lesson" class="lesson hidden">
    <div class="lesson-head">
      <span id="typeBadge" class="badge"></span>
      <h1 id="title"></h1>
      <div id="meta" class="meta"></div>
      <div id="materialId" class="id-line"></div>
    </div>

    <p id="description" class="description"></p>

    <section id="videoSection" class="video-wrap hidden">
      <iframe id="video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </section>

    <section id="imageSection" class="image-wrap hidden">
      <a id="imageLink" target="_blank" rel="noopener"><img id="imageEl" alt="صورة الدرس" loading="lazy"></a>
      <a id="imageFileLink" class="file-link" target="_blank" rel="noopener">تحميل الصورة</a>
    </section>

    <section id="fileSection" class="file-section hidden">
      <div class="file-card">
        <div class="file-icon" id="fileIcon">📄</div>
        <div class="file-info"><div class="file-name" id="fileName"></div></div>
        <a id="fileLink" class="file-link" target="_blank" rel="noopener">فتح الملف</a>
      </div>
    </section>

    <section id="textSection" class="text-content hidden">
      <h2>شرح الدرس</h2>
      <div id="content"></div>
    </section>

    <div id="emptyContent" class="empty hidden">لا يوجد محتوى إضافي للشرح.</div>
  </article>
</main>

<div id="chatModal" class="modal hidden">
  <div class="modal-box">
    <button class="close" id="closeChat" type="button">×</button>
    <div class="chat-title">مناقشة الدرس</div>
    <div id="chatMessages" class="chat-messages"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" maxlength="500" placeholder="اكتب رسالة للمدرس أو زملائك..." required autocomplete="off">
      <button type="submit">إرسال</button>
    </form>
  </div>
</div>

<script type="module" src="js/material.js"></script>
</body>
</html>
